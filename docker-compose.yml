services:
  app:
    build: .
    image: alfa-pulse:1.0.0
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false   # без .env сервис стартует в режиме rules
    volumes:
      - ./data:/app/data   # БД, профили, распознанная аналитика; страницы PDF после scripts/fetch_data.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
